name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    name: 'Phase 1: Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'

      - name: Setup pnpm
        uses: pnpm/setup@v6
        with:
          version: '12.9.0'
          runtime: node@26

      - name: Install dependencies
        run: pnpm ci

      - name: Build Application
        run: pnpm build