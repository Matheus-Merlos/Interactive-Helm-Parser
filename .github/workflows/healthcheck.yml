name: Healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  healthcheck:
    name: Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck
        run: |
            URL="https://$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]').github.io/${{ github.event.repository.name }}/"
            curl --retry 3 --retry-delay 5 -sS "$URL" | grep -q "${{ github.event.repository.name }}"
