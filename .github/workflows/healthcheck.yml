name: Healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  healthcheck:
    name: Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck
        run: curl  \
          --retry 3 \
          --retry-delay 5 \
          -sSF https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ | grep -q "${{ github.event.repository.name }}"
